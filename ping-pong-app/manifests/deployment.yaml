apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong-app
  template:
    metadata:
      labels:
        app: ping-pong-app
    spec:
      volumes:
        - name: pong-counter
          persistentVolumeClaim:
            claimName: log-pong-claim
      containers:
        - name: ping-pong-app
          image: kuroniil2/ping-pong-app:6.0
          volumeMounts:
            - name: pong-counter
              mountPath: /usr/src/app/counter
