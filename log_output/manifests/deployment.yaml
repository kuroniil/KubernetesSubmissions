apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: random-string
          emptyDir: {}
        - name: pong-counter
          persistentVolumeClaim:
            claimName: log-pong-claim
      containers:
        - name: log-output
          image: kuroniil2/log_output:11.0
          volumeMounts:
            - name: random-string
              mountPath: /usr/src/app/files
            - name: pong-counter
              mountPath: /usr/src/app/counter

        - name: generate-string
          image: kuroniil2/generate-string:4.0
          volumeMounts:
            - name: random-string
              mountPath: /usr/src/app/files
