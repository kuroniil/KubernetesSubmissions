apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: todo-app-dep
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image
          persistentVolumeClaim:
            claimName: image-claim
      containers:
        - name: todo-app
          image: PROJECT/IMAGE
          volumeMounts:
            - name: image
              mountPath: /usr/src/app/files
          env:
            - name: APP_PORT
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: APP_PORT
            - name: IMAGE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: IMAGE_API_URL
