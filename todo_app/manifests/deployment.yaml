apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image
          persistentVolumeClaim:
            claimName: image-claim
      containers:
        - name: todo-app
          image: kuroniil2/todo-app:23.0
          volumeMounts:
            - name: image
              mountPath: /usr/src/app/files
